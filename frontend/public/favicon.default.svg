<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- Linke Seite: MD-Badge (Markdown-Quelle) -->
  <rect x="6" y="20" width="20" height="24" rx="4" fill="#f8fafc"/>
  <text x="16" y="36" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700"
        fill="#0f172a" text-anchor="middle">MD</text>

  <!-- Pfeil: Transformation von MD zu Web -->
  <path d="M28 32 H37" stroke="#14b8a6" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M33 27 L38 32 L33 37" fill="none" stroke="#14b8a6" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rechte Seite: Browser/Web-Fenster -->
  <rect x="40" y="18" width="18" height="28" rx="3" fill="#f8fafc"/>
  <rect x="40" y="18" width="18" height="6" rx="3" fill="#cbd5e1"/>
  <circle cx="43.2" cy="21" r="0.9" fill="#64748b"/>
  <circle cx="45.6" cy="21" r="0.9" fill="#64748b"/>
  <path d="M43 32 H55 M43 36 H55 M43 40 H51" stroke="#64748b" stroke-width="1.6"
        stroke-linecap="round"/>
</svg>
